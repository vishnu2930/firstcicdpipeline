kind: pipeline
type: docker
name: Testing python CI/CD

steps:
- name: Black code format check
  image: vishnu2930/netauto
  commands:
  - black . --check

- name: Batfish prechecks
  image: vishnu2930/netauto
  commands:
  - python3 batfishcheck.py

- name: Precheck configuration diff
  image: vishnu2930/netauto
  environment:
    PASSWORD:
      from_secret: PASSWORD
    USER:
      from_secret: USER
  commands:
  - python3 build.py --dry_run

- name: Deploy configuration
  image: vishnu2930/netauto
  environment:
    PASSWORD:
      from_secret: PASSWORD
    USER:
      from_secret: USER
  commands:
  - python3 build.py --no_dry_run
  when:
    branch:
    - master
    - main

- name: Check IP interfaces
  image: vishnu2930/netauto
  environment:
    PASSWORD:
      from_secret: PASSWORD
    USER:
      from_secret: USER
    ENABLE_PASSWORD:
      from_secret: ENABLE_PASSWORD
  commands:
  # - pip install -r requirements.txt
  - python3 checkip.py
