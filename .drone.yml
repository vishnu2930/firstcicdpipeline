kind: pipeline
type: docker
name: Testing python CI/CD

steps:
- name: Black code format check
  image: vishnu2930/netauto
  commands:
  - black . --check

- name: Check IP interfaces
  image: vishnu2930/netauto
  environment:
    PASSWORD:
      from_secret: PASSWORD
    USER:
      from_secret: USER
    ENABLE_PASSWORD:
      from_secret: ENABLE_PASSWORD
  commands:
  # - pip install -r requirements.txt
  - python3 checkip.py